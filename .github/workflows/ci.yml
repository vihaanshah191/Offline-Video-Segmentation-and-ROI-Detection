name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        # Install the light runtime subset needed for tests. Object detection
        # (torch/ultralytics) and the Celery backend (celery/redis) are
        # disabled/unavailable in CI and both degrade gracefully — but
        # bcrypt and psutil are NOT optional: app/core/security.py imports
        # bcrypt unconditionally at module level (needed for password
        # hashing regardless of whether AUTH_ENABLED is set), and it's
        # imported transitively by every route via auth_deps.py, so its
        # absence breaks collecting the entire test suite, not just
        # auth-specific tests. psutil is imported lazily (wrapped in its own
        # try/except in health.py) so it degrades gracefully on its own, but
        # is installed here anyway so CI actually exercises that code path.
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" python-multipart pydantic \
            pydantic-settings SQLAlchemy opencv-python-headless numpy reportlab \
            bcrypt psutil pytest pytest-cov httpx ruff mypy

      - name: Ruff lint
        run: ruff check app tests

      - name: Mypy type-check
        run: mypy app --ignore-missing-imports

      - name: Run tests
        env:
          ENABLE_OBJECT_DETECTION: "false"
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: video-analytics-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: video-analytics-frontend:ci

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large video uploads (matches backend MAX_UPLOAD_MB default).
    client_max_body_size 8192M;

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # Proxy generated artefacts (heatmaps, clips, thumbnails).
    location /storage/ {
        proxy_pass http://backend:8000/storage/;
        proxy_set_header Host $host;
    }

    # Static asset caching.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

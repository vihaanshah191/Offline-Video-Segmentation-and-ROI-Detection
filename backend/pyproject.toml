[project]
name = "video-analytics-backend"
version = "1.0.0"
description = "Offline Video Segmentation and ROI Detection backend"
requires-python = ">=3.11"
readme = "../README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic.

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
plugins = []

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]
